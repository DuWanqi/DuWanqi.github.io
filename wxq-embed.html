<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="wxq-build" content="mvsovy8r">
<title>万象棋笔记</title>
<link rel="stylesheet" href="/css/app.css?v=mvsovy8r">
<style>
  /* Load official extracted Wanxiangqi fonts */
  @font-face {
    font-family: "OSGameFontTitle";
    src: url(/assets/OSGameFont_Title.ttf) format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "OSGameFontContent";
    src: url(/assets/OSGameFont_Content.ttf) format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "HYQiHei85S";
    src: url(/assets/HYQiHei_85S.ttf) format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "WanxiangDIN";
    src: url(/assets/Helvetica_Inserat_LT_Pro.ttf) format("truetype");
    font-display: swap;
  }

  /* Urban Tech Minimalism Design System (matching official extracted WXQ Community UI) */
  :root {
    --ink: #15171c;
    --ink-2: #191b20;
    --panel: rgba(20, 23, 29, 0.72);
    --panel-2: rgba(24, 28, 35, 0.84);
    --panel-3: rgba(30, 35, 44, 0.92);
    --line: rgba(178, 189, 204, 0.16);
    --line-2: rgba(178, 189, 204, 0.30);
    --text: #edf0f3;
    --text-2: #c5cbd3;
    --muted: #939ca9;
    --jade: #63c7c4;
    --jade-2: #8fdfdc;
    --gold: #d5b966;
    --gold-2: #f0b083;
    --danger: #ef9a7e;
    --radius: 3px;
    --radius-s: 2px;
    --font: "OSGameFontContent", "HYQiHei85S", "Wanxiang UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-display: "OSGameFontTitle", "HYQiHei85S", "Wanxiang UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
  }

  body {
    background: linear-gradient(90deg, #141824db, #131722ee 54%, #10141ef4),
                url(/assets/wxq-ui/bg-new.jpg) center top / cover fixed !important;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
    margin: 0;
    padding: 0;
  }
  body::before {
    display: none !important;
  }

  /* Hide redundant sub-header */
  .site-header {
    display: none !important;
  }

  /* Workspace container matching .rs-workspace in /analysis/dps */
  main.page-width {
    width: min(1496px, calc(100% - 64px));
    max-width: none;
    margin-inline: auto;
    padding: 22px 0 56px;
  }

  /* Top mode bar matching /analysis/dps .rs-mode-bar */
  .ut-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 18px;
    font-size: 12px;
    color: var(--muted);
  }
  .ut-top-tabs {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .ut-top-tabs a {
    position: relative;
    padding: 6px 0 10px;
    margin-bottom: -11px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 550;
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .ut-top-tabs a:hover {
    color: var(--text);
  }
  .ut-top-tabs a.is-active {
    color: #8fdfdc;
    box-shadow: inset 0 -2px #63c7c4;
  }
  .ut-top-status {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 11px;
    color: #aeb4bc;
  }
  .ut-top-status .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .ut-top-status .status-dot i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #81bfa8;
    display: inline-block;
  }
  .ut-search-trigger {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: rgba(20, 22, 27, 0.45);
    color: var(--text-2);
    font-size: 12px;
    cursor: pointer;
  }
  .ut-search-trigger:hover {
    border-color: #63c7c4;
    color: #fff;
  }
  .ut-search-trigger kbd {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 0 4px;
    border-radius: 2px;
  }

  /* Page Heading matching .rs-heading & .rr-head in /analysis/dps */
  .page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    padding: 2px 0 18px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .page-head .kicker {
    color: #77cfcc;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .page-head .kicker::before {
    display: none;
  }
  .page-head h1, .os-head h1 {
    margin: 2px 0 6px;
    font-family: "WanxiangTitle", var(--font);
    font-size: 30px;
    font-weight: 800;
    transform: skew(-5deg);
    transform-origin: left;
    letter-spacing: 0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #dce8f8 52%, #9eb2ce 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .page-head p {
    margin: 4px 0 0;
    color: #93a1a7;
    font-size: 13px;
    max-width: 880px;
    line-height: 1.55;
  }
  .page-head > a.btn.ghost[href="/playbooks"] {
    display: none;
  }

  /* Metrics strip matching .rr-metrics in /analysis/dps */
  .stat-row {
    display: flex;
    gap: 0;
    border-left: 1px solid var(--line);
  }
  .stat-chip {
    padding: 4px 18px;
    border: 0;
    border-right: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    min-width: 96px;
  }
  .stat-chip b {
    font-family: "WanxiangDIN", var(--font);
    font-size: 22px;
    font-weight: 700;
    color: #edf3f4;
    font-variant-numeric: tabular-nums;
  }
  .stat-chip span {
    font-size: 11px;
    color: #93a1a7;
  }

  /* Flat Hairline Panels instead of heavy rounded cards */
  .panel {
    background: rgba(16, 20, 26, 0.55);
    border: 1px solid var(--line);
    border-radius: 3px;
    box-shadow: none;
  }

  /* Playbooks Layout (.kn-layout) -> /analysis/dps 2-column hairline grid */
  .kn-layout {
    display: grid;
    grid-template-columns: 264px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  .kn-toc.panel {
    background: transparent;
    border: 0;
    border-right: 1px solid var(--line);
    border-radius: 0;
    padding: 0 20px 0 0;
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 40px);
  }
  .kn-toc .kicker {
    color: #939ca9;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px !important;
    display: block;
  }
  .kn-toc .kicker::before {
    display: none;
  }
  .pb-switch {
    display: grid;
    gap: 1px;
  }
  .pb-switch a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 2px;
    border: 0;
    color: #aeb5bf;
    font-size: 13px;
    transition: background 0.14s ease, color 0.14s ease;
  }
  .pb-switch a img {
    width: 28px;
    height: 28px;
    border-radius: 3px;
    object-fit: cover;
  }
  .pb-switch a:hover {
    background: rgba(210, 221, 229, 0.06);
    color: #edf0f3;
  }
  .pb-switch a.on {
    background: rgba(99, 199, 196, 0.10);
    box-shadow: inset 2px 0 #63c7c4;
    color: #8fdfdc;
    font-weight: 600;
  }
  .kn-toc a[data-h] {
    border-radius: 0;
    padding: 5px 8px;
    font-size: 12px;
    color: #93a1a7;
    border-left: 1px solid var(--line);
  }
  .kn-toc a[data-h]:hover {
    color: #8fdfdc;
    background: rgba(99, 199, 196, 0.06);
    border-left: 2px solid #63c7c4;
  }

  /* Playbook Markdown Article -> Clean Urban Tech Typography */
  article.md.panel {
    background: transparent;
    border: 0;
    padding: 0 4px 40px 0;
    color: #d6dde3;
    font-size: 14px;
    line-height: 1.75;
  }
  .md h2.md-h1 {
    font-family: var(--font);
    font-size: 22px;
    font-weight: 700;
    color: #edf3f4;
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .md h3.md-h2 {
    font-family: var(--font);
    font-size: 16px;
    font-weight: 650;
    color: #edf3f4;
    margin: 28px 0 12px;
    padding: 0 0 8px 10px;
    border-left: 2px solid #63c7c4;
    border-bottom: 1px solid var(--line);
  }
  .md h4.md-h3 {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 650;
    color: #77cfcc;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 18px 0 8px;
  }
  .md blockquote.md-quote {
    margin: 8px 0;
    padding: 10px 14px;
    border-left: 2px solid #d5b966;
    background: rgba(180, 148, 85, 0.07);
    border-radius: 0;
    color: #dfc7a0;
    font-size: 12.5px;
    line-height: 1.65;
  }
  .md pre.md-code {
    margin: 12px 0;
    padding: 14px 16px;
    border-radius: 2px;
    background: rgba(11, 20, 25, 0.78);
    border: 1px solid var(--line);
    border-left: 2px solid #63c7c4;
    color: #8fdfdc;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 13px;
    line-height: 1.65;
  }
  .md b {
    color: #edf3f4;
    font-weight: 650;
  }
  .md-table {
    margin: 12px 0 18px;
    border-top: 1px solid var(--line);
  }
  table.odds {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.odds th {
    padding: 9px 12px;
    color: #93a1a7;
    font-size: 11.5px;
    font-weight: 600;
    border-bottom: 1px solid var(--line-2);
    background: rgba(255, 255, 255, 0.02);
    text-align: left;
  }
  table.odds td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    color: #d6dde3;
    line-height: 1.6;
  }
  table.odds tr:hover td {
    background: rgba(99, 199, 196, 0.05);
  }

  /* Entity Inline Highlights matching /analysis/dps damage type palette */
  .ent {
    border-bottom: 1px solid rgba(143, 223, 220, 0.35);
    border-radius: 0;
    padding: 0 1px;
  }
  .ent:hover {
    background: rgba(99, 199, 196, 0.14);
  }
  .ent-hero { color: #8fdfdc; }
  .ent-equip { color: #d5b966; }
  .ent-talent { color: #c5a0eb; }
  .ent-effect { color: #82c998; }
  .ent-lord { color: #f49b6b; }

  /* Filter Chips & Segmented Buttons -> Sharp Urban Tech Tabs (.rr-tabs style) */
  .topic-chips {
    gap: 6px;
    margin: 0 0 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .chip, .topic-chips .chip {
    padding: 5px 11px;
    border-radius: 2px !important;
    border: 1px solid var(--line);
    background: rgba(20, 22, 27, 0.45);
    color: #aeb5bf;
    font-size: 12px;
    transition: all 0.14s ease;
  }
  .chip:hover, .topic-chips .chip:hover {
    border-color: rgba(182, 195, 208, 0.45);
    background: rgba(210, 221, 229, 0.07);
    color: #edf0f3;
  }
  .chip.on, .topic-chips .chip.on {
    border-color: rgba(99, 199, 196, 0.55);
    box-shadow: inset 0 -2px #63c7c4;
    background: rgba(99, 199, 196, 0.10);
    color: #8fdfdc;
  }

  .toolbar {
    position: static;
    background: rgba(15, 19, 24, 0.65);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 12px 14px;
  }
  .toolbar input[type=search], .field input, .field select, .picker input[type=search] {
    border-radius: 2px;
    border: 1px solid var(--line-2);
    background: rgba(14, 17, 22, 0.85);
    color: #edf0f3;
  }
  .toolbar select {
    padding: 5px 10px;
    border-radius: 2px;
    border: 1px solid var(--line-2);
    background: rgba(14, 17, 22, 0.85);
  }

  /* Lineups Grid -> Sharp Tactical Cards */
  .lineup-grid {
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }
  .lineup-card {
    padding: 15px 16px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: rgba(16, 20, 26, 0.62);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .lineup-card:hover {
    transform: none;
    border-color: rgba(99, 199, 196, 0.55);
    background: rgba(22, 28, 36, 0.82);
    box-shadow: inset 2px 0 #63c7c4;
  }
  .lineup-card h3 {
    font-size: 15px;
    font-weight: 650;
    color: #edf0f3;
  }
  .lineup-card .faces img {
    width: 40px;
    height: 40px;
    border-radius: 3px;
    border: 1px solid var(--line-2);
  }
  .lineup-card .faces img.evo {
    border-color: #d5b966;
    box-shadow: none;
  }
  .tag {
    border-radius: 2px;
    font-size: 10.5px;
    padding: 1px 6px;
  }
  .tag.gold {
    color: #d5b966;
    border-color: rgba(213, 185, 102, 0.4);
    background: rgba(213, 185, 102, 0.1);
  }
  .tag.jade {
    color: #8fdfdc;
    border-color: rgba(99, 199, 196, 0.4);
    background: rgba(99, 199, 196, 0.1);
  }

  /* Counter Matrix (.ct-matrix) -> Tactical Grid */
  .ct-matrix-wrap {
    border-radius: 3px;
    background: rgba(14, 18, 24, 0.68);
  }
  .ct-matrix tbody th {
    background: #171a21;
  }
  .ct-matrix tbody th .ct-face, .ct-face {
    border-radius: 3px;
  }
  .ct-mech-card {
    border-radius: 3px;
    background: rgba(16, 20, 26, 0.62);
    border-left: 2px solid #63c7c4;
  }

  /* Lab (.lab-layout) -> Exact match with /analysis/dps .rs-grid */
  .lab-layout {
    grid-template-columns: 280px minmax(0, 1fr);
    gap: 28px;
  }
  .lab-side {
    padding-right: 22px;
    border-right: 1px solid var(--line);
    gap: 0;
  }
  .lab-side .panel {
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 14px 0 !important;
  }
  .lab-side .panel:first-child {
    padding-top: 0 !important;
  }
  .hero-pick {
    border-radius: 3px;
    border: 1px solid var(--line);
    background: rgba(20, 23, 29, 0.55);
    padding: 10px;
  }
  .hero-pick img {
    width: 54px;
    height: 54px;
    border-radius: 3px;
  }
  .hero-pick b {
    font-size: 20px;
    font-weight: 600;
  }
  .slot {
    border-radius: 3px;
    border: 1px dashed rgba(169, 185, 204, 0.28);
    background: rgba(20, 22, 27, 0.35);
  }
  .big-nums {
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .big-nums div {
    background: transparent;
    border: 0;
    border-right: 1px solid var(--line);
    border-radius: 0;
    padding: 14px 16px 14px 0;
    padding-left: 16px;
  }
  .big-nums div:first-child {
    padding-left: 0;
  }
  .big-nums div:last-child {
    border-right: 0;
  }
  .big-nums b {
    font-family: "WanxiangDIN", var(--font);
    font-size: 24px;
    font-weight: 700;
    color: #edf3f4;
  }
  .big-nums b.jade {
    color: #8fdfdc;
  }
  canvas.chart {
    border-radius: 2px;
    background: rgba(11, 20, 25, 0.55);
    border: 1px solid var(--line);
  }

  /* Drawer & Popovers -> Sharp Dark Slate (#202228 like .rs-picker) */
  .drawer {
    background: #1c1f26;
    border-left: 1px solid rgba(178, 189, 204, 0.25);
  }
  .picker, .palette, .ent-tip {
    background: #202228;
    border: 1px solid rgba(116, 124, 137, 0.48);
    border-radius: 4px;
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55);
  }
  .btn {
    border-radius: 3px;
    border: 1px solid var(--line-2);
    background: rgba(24, 28, 35, 0.75);
    font-size: 13px;
  }
  .btn:hover {
    border-color: #63c7c4;
    color: #8fdfdc;
  }

  footer {
    border-top: 1px solid var(--line);
    margin-top: 40px;
    padding: 18px 0 24px;
    color: #8993a1;
    font-size: 11.5px;
  }

  /* ========= OS Entity Counter & Mechanism Graph Workbench (matching /analysis/dps) ========= */
  .os-page {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .os-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .os-eyebrow {
    margin: 0 0 4px;
    font-size: 10.5px;
    font-weight: 600;
    color: #77cfcc;
    letter-spacing: 0.08em;
  }
  .os-head h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.04em;
    background: linear-gradient(180deg, #ffffff 0%, #dce8f8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .os-sub {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: #93a1a7;
    max-width: 720px;
  }
  .os-metrics {
    display: flex;
    border-left: 1px solid var(--line);
    flex-shrink: 0;
  }
  .os-metric {
    padding: 2px 16px;
    border-right: 1px solid var(--line);
    min-width: 112px;
  }
  .os-metric span {
    display: block;
    font-size: 11px;
    color: #93a1a7;
  }
  .os-metric strong {
    display: block;
    font-family: "WanxiangDIN", var(--font);
    font-size: 21px;
    font-weight: 700;
    color: #edf3f4;
    margin-top: 2px;
  }
  .os-metric small {
    display: block;
    font-size: 10px;
    color: #77cfcc;
  }
  .os-mode-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .os-mode-tabs {
    display: flex;
    gap: 12px;
  }
  .os-mode-tab {
    padding: 9px 18px;
    border-radius: 999px;
    background: url(/assets/wxq-ui/filter-bg.png) center / 100% 100% no-repeat;
    border: 0;
    color: #b4c0d0;
    font-family: var(--font-display);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .os-mode-tab:hover {
    color: #ffffff;
  }
  .os-mode-tab.is-active {
    color: #ffffff;
    background: url(/assets/wxq-ui/filter-act.png) center / 100% 100% no-repeat;
    box-shadow: 0 0 16px rgba(99, 199, 196, 0.25);
  }
  .os-mode-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: #aeb4bc;
  }
  .os-mode-status i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #81bfa8;
  }

  /* 3-Column Hairline Grid */
  .os-grid {
    display: grid;
    grid-template-columns: 284px 410px minmax(0, 1fr);
    border: 1px solid var(--line);
    background: rgba(14, 17, 22, 0.52);
    min-height: 740px;
  }
  .os-col-atlas {
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    max-height: 780px;
  }
  .os-atlas-top {
    padding: 12px;
    border-bottom: 1px solid var(--line);
  }
  .os-search-box input {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--line-2);
    border-radius: 2px;
    background: rgba(12, 15, 20, 0.85);
    color: #edf0f3;
    font-size: 12.5px;
  }
  .os-search-box input:focus {
    outline: none;
    border-color: #63c7c4;
  }
  .os-type-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .os-type-btn {

<script>
  (function() {
    var quickSearchBtn = document.getElementById('utQuickSearch');
    var hiddenSearchBtn = document.getElementById('searchBtn');
    if (quickSearchBtn && hiddenSearchBtn) {
      quickSearchBtn.addEventListener('click', function() {
        hiddenSearchBtn.click();
      });
    }

    function syncActiveTab() {
      var p = location.pathname || '/';
      var seg = p.split('/').filter(Boolean)[0] || 'playbooks';
      if (seg === 'lineup' || seg === 'top') seg = 'lineups';
      var links = document.querySelectorAll('#utTopTabs a[data-tab]');
      for (var i = 0; i < links.length; i++) {
        var tab = links[i].getAttribute('data-tab');
        links[i].classList.toggle('is-active', tab === seg);
      }
    }

    function cleanWeirdIcons() {
      var tags = document.querySelectorAll('.tag');
      for (var i = 0; i < tags.length; i++) {
        var t = tags[i].textContent || '';
        if (t.indexOf('🚀') !== -1) {
          tags[i].textContent = t.replace(/🚀\s*/g, '');
        }
      }
      var titles = document.querySelectorAll('title');
      if (document.title && document.title.indexOf('万象棋知识库') !== -1) {
        document.title = document.title.replace(/万象棋知识库/g, '万象棋笔记');
      }
      syncActiveTab();
      if (window.OSCounterGraph && typeof window.OSCounterGraph.mountIfNeeded === 'function') {
        window.OSCounterGraph.mountIfNeeded();
      }
      if (window.WeComLineupNotes && typeof window.WeComLineupNotes.mountIfNeeded === 'function') {
        window.WeComLineupNotes.mountIfNeeded();
      }
    }

    function notifyParentRoute() {
      cleanWeirdIcons();
      if (window.parent && window.parent !== window) {
        var p = location.pathname + location.search;
        var hostRoute = p;
        if (p === '/lineups' || p.startsWith('/lineups?')) {
          hostRoute = '/wxq-lineups' + p.slice('/lineups'.length);
        }
        window.parent.postMessage({
          type: 'WXQ_ROUTE_CHANGED',
          route: hostRoute,
          title: document.title
        }, '*');
      }
    }

    var wxqApp = (typeof App !== 'undefined') ? App : window.App;
    if (wxqApp) {
      window.App = wxqApp;
    }
    if (wxqApp && typeof wxqApp.go === 'function') {
      var origGo = wxqApp.go.bind(wxqApp);
      wxqApp.go = function(url) {
        if (url === '/atlas') {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'WXQ_NAVIGATE_HOST', route: '/atlas' }, '*');
            return;
          }
        }
        if (url === '/playbooks') url = '/playbooks/ali_zhadunyao';
        origGo(url);
        notifyParentRoute();
      };
    }

    window.addEventListener('popstate', notifyParentRoute);
    setTimeout(cleanWeirdIcons, 100);
    var obs = new MutationObserver(cleanWeirdIcons);
    var appEl = document.getElementById('app');
    if (appEl) obs.observe(appEl, { childList: true, subtree: true });

    window.addEventListener('message', function(ev) {
      var d = ev.data;
      if (!d || d.type !== 'HOST_SET_WXQ_ROUTE') return;
      var target = d.route || '/playbooks/ali_zhadunyao';
      if (target === '/wxq-lineups') target = '/lineups';
      else if (target.startsWith('/wxq-lineups?')) target = '/lineups' + target.slice('/wxq-lineups'.length);
      else if (target === '/playbooks') target = '/playbooks/ali_zhadunyao';
      var cur = location.pathname + location.search;
      var appInst = (typeof App !== 'undefined') ? App : window.App;
      if (cur !== target && appInst && typeof appInst.go === 'function') {
        appInst.go(target);
      }
    });
  })();
</script>
